<!doctype html>
<html>

<head>
	<meta charset="UTF-8" />
	<link href="./popup.css" rel="stylesheet" type="text/css" />
</head>

<body class="dark">
	<div id="template">
		<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
			<defs>
				<g id="svg-plus">
					<path d="M20 14H14V20H10V14H4V10H10V4H14V10H20V14Z" />
				</g>
				<g id="svg-minus">
					<path d="M20 14H4V10H20" />
				</g>
				<g id="svg-warning">
					<path
						d="M11.9998 8.99999V13M11.9998 17H12.0098M10.6151 3.89171L2.39019 18.0983C1.93398 18.8863 1.70588 19.2803 1.73959 19.6037C1.769 19.8857 1.91677 20.142 2.14613 20.3088C2.40908 20.5 2.86435 20.5 3.77487 20.5H20.2246C21.1352 20.5 21.5904 20.5 21.8534 20.3088C22.0827 20.142 22.2305 19.8857 22.2599 19.6037C22.2936 19.2803 22.0655 18.8863 21.6093 18.0983L13.3844 3.89171C12.9299 3.10654 12.7026 2.71396 12.4061 2.58211C12.1474 2.4671 11.8521 2.4671 11.5935 2.58211C11.2969 2.71396 11.0696 3.10655 10.6151 3.89171Z" />
				</g>
				<g id="svg-info">
					<path
						d="M12 16V12M12 8H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" />
				</g>
				<g id="svg-contrast">
					<path
						d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" />
					<path fill="currentColor"
						d="M12 18.5C15.5899 18.5 18.5 15.5899 18.5 12C18.5 8.41015 15.5899 5.5 12 5.5V18.5Z" />
				</g>
			</defs>
		</svg>
	</div>
	<div id="loading-wrapper">
		<div id="loading" data-text="loading">Loading…</div>
		<p id="reinstall-tip" data-text="reinstallTip">
			Preference data may be corrupted. If the issue persists, please
			reinstall the add-on. We apologise for the inconvenience.
		</p>
	</div>
	<div id="settings-wrapper">
		<div id="info-display-wrapper">
			<svg viewBox="0 0 24 24">
				<use xlink:href="#svg-info" />
			</svg>
			<div class="info-display" name="PROTECTED_PAGE">
				<div data-text="pageIsProtected"></div>
			</div>
			<div class="info-display" name="HOME_PAGE">
				<div data-text="colorForHomePage"></div>
			</div>
			<div class="info-display" name="TEXT_VIEWER">
				<div data-text="colorForPlainTextViewer"></div>
			</div>
			<div class="info-display" name="IMAGE_VIEWER">
				<div data-text="usingImageViewer"></div>
			</div>
			<div class="info-display" name="PDF_VIEWER">
				<div data-text="colorForPDFViewer"></div>
			</div>
			<div class="info-display" name="JSON_VIEWER">
				<div data-text="colorForJSONViewer"></div>
			</div>
			<div class="info-display" name="ERROR_OCCURRED">
				<div data-text="errorOccured"></div>
			</div>
			<div class="info-display" name="FALLBACK_color">
				<div data-text="usingFallbackcolor"></div>
			</div>
			<div class="info-display" name="color_PICKED">
				<div data-text="colorPickedFromWebpage"></div>
			</div>
			<div class="info-display" name="ADDON_SPECIFIED">
				<div data-text="useDefaultcolorForAddon"></div>
				<div class="additional-info"></div>
				<div data-text="useDefaultcolorForAddonEnd"></div>
				<button class="info-action" data-title="useDefaultcolorForAddonTitle"
					data-text="useDefaultcolorForAddonButton"></button>
			</div>
			<div class="info-display" name="ADDON_RECOM">
				<div data-text="useRecommendedcolorForAddon"></div>
				<div class="additional-info"></div>
				<div data-text="useRecommendedcolorForAddonEnd"></div>
				<button class="info-action" data-title="useRecommendedcolorForAddonTitle"
					data-text="useRecommendedcolorForAddonButton"></button>
			</div>
			<div class="info-display" name="ADDON_DEFAULT">
				<div data-text="specifycolorForAddon"></div>
				<div class="additional-info"></div>
				<div data-text="specifycolorForAddonEnd"></div>
				<button class="info-action" data-title="specifycolorForAddonTitle"
					data-text="specifycolorForAddonButton"></button>
			</div>
			<div class="info-display" name="THEME_UNIGNORED">
				<div data-text="themecolorIsUnignored"></div>
				<button class="info-action" data-title="ignoreThemecolorTitle"
					data-text="ignoreThemecolorButton"></button>
			</div>
			<div class="info-display" name="THEME_MISSING">
				<div data-text="themecolorNotFound"></div>
			</div>
			<div class="info-display" name="THEME_IGNORED">
				<div data-text="themecolorIsIgnored"></div>
				<button class="info-action" data-title="useThemecolorTitle" data-text="useThemecolorButton"></button>
			</div>
			<div class="info-display" name="THEME_USED">
				<div data-text="usingThemecolor"></div>
				<button class="info-action" data-title="ignoreThemecolorTitle"
					data-text="ignoreThemecolorButton"></button>
			</div>
			<div class="info-display" name="QS_USED">
				<div data-text="colorIsPickedFrom"></div>
				<div class="additional-info"></div>
				<div data-text="colorIsPickedFromEnd"></div>
			</div>
			<div class="info-display" name="QS_FAILED">
				<div data-text="cannotFindElement"></div>
				<div class="additional-info"></div>
				<div data-text="cannotFindElementEnd"></div>
			</div>
			<div class="info-display" name="QS_ERROR">
				<div data-text="errorOccuredLocatingElement"></div>
				<div class="additional-info"></div>
				<div data-text="errorOccuredLocatingElementEnd"></div>
			</div>
			<div class="info-display" name="color_SPECIFIED">
				<div data-text="colorIsSpecified"></div>
			</div>
		</div>
		<div id="color-correction-info" class="hidden">
			<svg viewBox="0 0 24 24">
				<use xlink:href="#svg-contrast" />
			</svg>
			<span data-text="colorIsAdjusted"></span>
		</div>
		<div class="section-group">
			<div class="section-group-title" data-text="themeBuilder"></div>
			<div class="section">
				<div class="section-title" data-text="selectedTab"></div>
				<div class="slider" data-pref="tabSelected" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="tabSelectedBorder" data-min="-50" data-max="50" data-step="5"
					data-value="0">
					<div class="slider-title" data-text="border"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
			<div class="section">
				<div class="section-title" data-text="tabBar"></div>
				<div class="slider" data-pref="tabbar" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="tabbarBorder" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title">
						<span data-text="border"></span>
						<span
							title="If “vertical tabs” are enabled, any non-zero value may cause a gap to appear above the window controls, making them harder to reach."
							style="cursor: help">
							<svg viewBox="0 0 24 24">
								<use xlink:href="#svg-warning" />
							</svg>
						</span>
					</div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
			<div class="section">
				<div class="section-title" data-text="popUp"></div>
				<div class="slider" data-pref="popup" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="popupBorder" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="border"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
			<div class="section">
				<div class="section-title" data-text="urlBar"></div>
				<div class="slider" data-pref="toolbarField" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="toolbarFieldOnFocus" data-min="-50" data-max="50" data-step="5"
					data-value="0">
					<div class="slider-title" data-text="backgroundOnFocus"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="toolbarFieldBorder" data-min="-50" data-max="50" data-step="5"
					data-value="0">
					<div class="slider-title" data-text="border"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
			<div class="section">
				<div class="section-title" data-text="toolbar"></div>
				<div class="slider" data-pref="toolbar" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="toolbarBorder" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="border"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
			<div class="section">
				<div class="section-title" data-text="sidebar"></div>
				<div class="slider" data-pref="sidebar" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="background"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
				<div class="slider" data-pref="sidebarBorder" data-min="-50" data-max="50" data-step="5" data-value="0">
					<div class="slider-title" data-text="border"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-minus" />
						</svg>
					</button>
					<div class="slider-body"></div>
					<button>
						<svg viewBox="0 0 24 24">
							<use xlink:href="#svg-plus" />
						</svg>
					</button>
				</div>
			</div>
		</div>
		<button id="custom-popup" data-text="moreSettings" data-title="moreSettingsTooltip"></button>
	</div>
	<script defer type="module" src="./popup.js"></script>
</body>

</html>
